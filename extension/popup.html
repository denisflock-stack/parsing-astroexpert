<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astro Parser D1</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-main">
        <h1 id="d1Title">D1</h1>
        <p id="userData" class="user-data">-</p>
      </div>
      <div class="header-actions">
        <button id="helpToggle" class="secondary" type="button">Help</button>
        <button id="langToggle" class="secondary" type="button">EN</button>
      </div>
    </header>

    <section id="helpPanel" class="help-panel hidden" aria-live="polite">
      <div class="help-card">
        <div class="help-card-header">
          <strong id="helpTitle">How to use</strong>
          <button id="helpClose" class="secondary help-close" type="button" aria-label="Close help">Close</button>
        </div>
        <ol id="helpSteps" class="help-steps"></ol>
        <div class="help-prompt-actions">
          <button id="promptToggle" class="secondary" type="button">Example prompt</button>
          <button id="promptEdit" class="secondary hidden" type="button">Edit</button>
          <button id="promptCopy" class="accent hidden" type="button">Copy prompt</button>
          <button id="promptReset" class="secondary hidden" type="button">Reset</button>
        </div>
        <p id="promptNote" class="prompt-note hidden"></p>
        <pre id="promptPreview" class="prompt-preview hidden"></pre>
        <textarea id="promptEditor" class="prompt-editor hidden" spellcheck="false"></textarea>
      </div>
    </section>

    <section id="chartMode" class="mode-section">
      <section class="controls">
        <button id="refreshBtn">Parse</button>
        <button id="copySelectedBtn" class="accent">Copy selected</button>
      </section>

      <section id="chartControls" class="controls small header-row">
        <label><input type="checkbox" id="selectAll" /> <span id="selectAllLabel">Select all</span></label>
      </section>

      <ul id="chartList" class="chart-list"></ul>
    </section>

    <section id="vimMode" class="mode-section hidden">
      <section class="controls small header-row">
        <label><input type="checkbox" id="vimSelectAll" /> <span id="vimSelectAllLabel">Select all</span></label>
        <div class="inline-actions">
          <button id="pinPanelBtn">Pin</button>
          <button id="refreshTreeBtn">Refresh</button>
          <button id="copyTreeBtn" class="accent">Copy text</button>
        </div>
      </section>

      <section class="controls horizon-controls">
        <select id="levelSelect">
          <option value="2">Antardasha</option>
          <option value="3">Pratyantardasha</option>
        </select>
        <select id="fromPresetSelect"></select>
        <input type="date" id="fromDateInput" />
        <input type="date" id="toDateInput" />
        <select id="toPresetSelect"></select>
        <button id="applyHorizonBtn">Open</button>
      </section>

      <div id="vimshottariTree" class="vimshottari-tree"></div>
    </section>

    <p id="status" class="status"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
