<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Astro.Expert Result</title>
  <link rel="stylesheet" href="collect-result.css" />
</head>
<body>
  <main class="page">
    <header class="header">
      <div>
        <h1 id="title">Collected data</h1>
        <p id="subtitle">Review the result and copy it into the AI chat.</p>
      </div>
      <button id="copyBtn" type="button">Copy result</button>
    </header>
    <p id="status" class="status"></p>
    <textarea id="resultText" spellcheck="false"></textarea>
    <section class="request-section" aria-labelledby="requestLabel">
      <label id="requestLabel" class="visually-hidden" for="userRequest">User request</label>
      <p id="requestHint">Here you can write your request to AI and copy everything together.</p>
      <textarea id="userRequest" class="request-text" spellcheck="true"></textarea>
    </section>
  </main>
  <script src="collect-result.js"></script>
</body>
</html>
